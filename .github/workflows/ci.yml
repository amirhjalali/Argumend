name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        # `bun test` invokes Bun's native runner, which ignores vitest.config
        # (happy-dom) — so component tests fail with "document is not defined".
        # The suite is vitest; run it in single-run mode via the project script.
        run: bun run test:ci
      - name: Build
        run: bun run build
      - name: Smoke standalone package
        run: bun run smoke:standalone

  e2e:
    # Drives the production build in Chromium at 390px and 1440px
    # (e2e/*.spec.ts). Built exactly like the check job: no env, so every
    # live flag is off and no provider key or database is present.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          # Production runs the standalone server on Node 20 (Dockerfile).
          node-version-file: .node-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps --only-shell chromium
      - name: Build
        run: bun run build
      - name: End-to-end tests
        # playwright.config starts .next/standalone/server.js on port 3290
        # with the offline environment, and stops it afterwards.
        run: bun run test:e2e
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
