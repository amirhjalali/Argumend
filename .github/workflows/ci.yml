name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        # `bun test` invokes Bun's native runner, which ignores vitest.config
        # (happy-dom) — so component tests fail with "document is not defined".
        # The suite is vitest; run it in single-run mode via the project script.
        run: bun run test:ci
      - name: Build
        run: bun run build
      - name: Smoke standalone package
        run: bun run smoke:standalone
